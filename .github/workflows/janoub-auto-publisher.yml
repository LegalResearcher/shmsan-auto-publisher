name: نشر تلقائي - الجنوب فويس

on:
  schedule:
    # كل 5 دقائق — أسرع تكرار تدعمه جدولة GitHub Actions فعلياً (لا يوجد
    # أسرع من ذلك حتى لو كُتب أقل). ⚠️ هذا التكرار مناسب فقط لمستودع عام
    # (Public) — لو المستودع خاص فسيتجاوز الحصة المجانية (2000 دقيقة/شهر)
    # خلال أيام قليلة فقط.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # يسمح بتشغيل يدوي فوري من تبويب Actions للاختبار

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل بوت النشر
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python auto_publish_janoub.py
